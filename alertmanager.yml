global:
  resolve_timeout: 1m
  http_config:
    tls_config:
      insecure_skip_verify: true

inhibit_rules:
  - source_matchers:
      - severity =~ ".*[Cc]ritical.*"
    target_matchers:
      - severity =~ ".*[Ww]arning.*|.*[Ii]nfo.*"
    equal: ['alertname', 'instance']

route:
  receiver: 'email-slack-notifications'
  group_by: ['...']
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 1h

  routes:
#..................................................Jira Ticket..............................................
  - match:
    receiver: 'log-to-file-STX'
    continue: true
  - match:
      severity: "Critical 50%"
    receiver: 'jira-email_90%'
    continue: true
  - match:
      severity: "Critical 90%"
    receiver: 'jira-email_90%'
    continue: true
  - match:
      severity: "Critical 95%"
    receiver: 'jira-email_95%'
    continue: true
  - match:
      severity: "Warning 60%"
    receiver: 'jira-email_60%'
    continue: true
  - match:
      severity: "Critical 65%"
    receiver: 'jira-email_65%'
    continue: true
  - match:
      severity: "Critical 75%"
    receiver: 'jira-email_75%'
    continue: true

  - match:
      severity: "Critical - Instance Down"
    receiver: 'jira-email_InstanceDown'
    continue: true
  - match:
      severity: "critical service down"
    receiver: 'jira-email_critical service down'
    continue: true

  - match:
      severity: "critical"
    receiver: 'jira-email_critical service down'
    continue: true

  - match:
      severity: "warning"
    receiver: 'jira-email_critical service down'
    continue: true

  - match:
      severity: "info"
    receiver: 'jira-email_critical service down'
    continue: true

  - match:
      severity: 'critical-api-port'
    receiver: 'jira-critical-api-port'
    continue: true      

#-----------------------------------bandwidth-monitoring-----------------------------------------------------
  - match:
      group: 'bandwidth-monitoring'
    receiver: 'email-bandwidth-monitoring'
    continue: true

  - match:
      group: 'bandwidth-monitoring'
    receiver: 'bandwidth-monitoring-slack'
    continue: true

#......................................vinayb_api API and Port alerts email....................................
